name: Playwright Tests
on:
  push:
    branches: [ AI-MCP, main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Verify test credentials are configured
      env:
        ECOM_USERNAME: ${{ secrets.ECOM_USERNAME }}
        ECOM_PASSWORD: ${{ secrets.ECOM_PASSWORD }}
      run: |
        if [ -z "$ECOM_USERNAME" ] || [ -z "$ECOM_PASSWORD" ]; then
          echo "Configure ECOM_USERNAME and ECOM_PASSWORD as repository Actions secrets."
          exit 1
        fi
    - name: Run Playwright tests
      run: npx playwright test
      env:
        ECOM_USERNAME: ${{ secrets.ECOM_USERNAME }}
        ECOM_PASSWORD: ${{ secrets.ECOM_PASSWORD }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
